name: Build LaTeX document

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v2
        with:
          root_file: wp.tex

      - name: Upload build artifact (for all branches)
        uses: actions/upload-artifact@v4
        with:
          name: cv-build
          path: wp.pdf

      - name: Set short SHA (only for main)
        if: github.ref == 'refs/heads/main'
        run: echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Create GitHub Release (only for main)
        if: github.ref == 'refs/heads/main'
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.GITHUB_SHA_SHORT }}
          name: Release ${{ env.GITHUB_SHA_SHORT }}
          body: Auto-generated release
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (only for main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: wp.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}